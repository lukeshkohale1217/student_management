{% extends "base.html" %}
{% block title %}Add Course{% endblock %}
{% block content %}
<h2 class="mb-4">Add Course</h2>
<div class="card p-4" style="max-width:600px;">
<form method="post">
  <div class="mb-3">
    <label class="form-label">Course Code</label>
    <input type="text" name="course_code" class="form-control" required placeholder="e.g. CS101">
  </div>
  <div class="mb-3">
    <label class="form-label">Course Name</label>
    <input type="text" name="course_name" class="form-control" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Credits</label>
    <input type="number" name="credits" class="form-control" value="3" min="1" max="10">
  </div>
  <div class="mb-3">
    <label class="form-label">Instructor</label>
    <input type="text" name="instructor" class="form-control">
  </div>
  <button type="submit" class="btn btn-success">Save</button>
  <a href="{{ url_for('list_courses') }}" class="btn btn-outline-secondary">Cancel</a>
</form>
</div>
{% endblock %}
