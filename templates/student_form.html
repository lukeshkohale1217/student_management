{% extends "base.html" %}
{% block title %}{{ "Edit" if student else "Add" }} Student{% endblock %}
{% block content %}
<h2 class="mb-4">{{ "Edit" if student else "Add" }} Student</h2>
<div class="card p-4" style="max-width:600px;">
<form method="post">
  <div class="mb-3">
    <label class="form-label">First Name</label>
    <input type="text" name="first_name" class="form-control" required
           value="{{ student.first_name if student else '' }}">
  </div>
  <div class="mb-3">
    <label class="form-label">Last Name</label>
    <input type="text" name="last_name" class="form-control" required
           value="{{ student.last_name if student else '' }}">
  </div>
  <div class="mb-3">
    <label class="form-label">Email</label>
    <input type="email" name="email" class="form-control" required
           value="{{ student.email if student else '' }}">
  </div>
  <div class="mb-3">
    <label class="form-label">Phone</label>
    <input type="text" name="phone" class="form-control"
           value="{{ student.phone if student else '' }}">
  </div>
  <div class="mb-3">
    <label class="form-label">Date of Birth</label>
    <input type="date" name="date_of_birth" class="form-control"
           value="{{ student.date_of_birth if student else '' }}">
  </div>
  <div class="mb-3">
    <label class="form-label">Gender</label>
    <select name="gender" class="form-select">
      <option value="" {% if not student %}selected{% endif %}>Select</option>
      <option value="Male" {% if student and student.gender=='Male' %}selected{% endif %}>Male</option>
      <option value="Female" {% if student and student.gender=='Female' %}selected{% endif %}>Female</option>
      <option value="Other" {% if student and student.gender=='Other' %}selected{% endif %}>Other</option>
    </select>
  </div>
  <div class="mb-3">
    <label class="form-label">Address</label>
    <textarea name="address" class="form-control" rows="2">{{ student.address if student else '' }}</textarea>
  </div>
  <button type="submit" class="btn btn-primary">Save</button>
  <a href="{{ url_for('list_students') }}" class="btn btn-outline-secondary">Cancel</a>
</form>
</div>
{% endblock %}
