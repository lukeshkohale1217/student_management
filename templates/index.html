{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}
{% block content %}
<h2 class="mb-4">Dashboard</h2>
<div class="row g-4">
  <div class="col-md-4">
    <div class="card p-4 text-center">
      <div class="stat-number text-primary">{{ student_count }}</div>
      <div>Students</div>
    </div>
  </div>
  <div class="col-md-4">
    <div class="card p-4 text-center">
      <div class="stat-number text-success">{{ course_count }}</div>
      <div>Courses</div>
    </div>
  </div>
  <div class="col-md-4">
    <div class="card p-4 text-center">
      <div class="stat-number text-warning">{{ enrollment_count }}</div>
      <div>Enrollments</div>
    </div>
  </div>
</div>

<div class="mt-5">
  <h5>Quick actions</h5>
  <a href="{{ url_for('add_student') }}" class="btn btn-primary me-2">+ Add Student</a>
  <a href="{{ url_for('add_course') }}" class="btn btn-success me-2">+ Add Course</a>
  <a href="{{ url_for('add_enrollment') }}" class="btn btn-warning">+ Add Enrollment</a>
</div>
{% endblock %}
